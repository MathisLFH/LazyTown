name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and analysis
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP and Composer cache
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: pdo_sqlite, sqlite3
          ini-values: memory_limit=1G
          coverage: none
          cache: composer

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Run backend checks
        run: composer test

  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP and Composer cache
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
          cache: composer

      - name: Prepare Laravel environment
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate Wayfinder routes
        run: php artisan wayfinder:generate --with-form --no-interaction

      - name: Setup Node and npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.20.2'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint:check

      - name: Check frontend formatting
        run: npm run format:check

      - name: Check TypeScript types
        run: npm run types:check

      - name: Build frontend assets
        run: npm run build

  deploy:
    name: Deploy to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.DEPLOY_ENABLED == 'true'
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP and Composer cache
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
          cache: composer

      - name: Prepare Laravel environment
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate Wayfinder routes
        run: php artisan wayfinder:generate --with-form --no-interaction

      - name: Setup Node and npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.20.2'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Package release
        run: |
          tar -czf "$RUNNER_TEMP/lazytown-release.tar.gz" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='storage' \
            --exclude='bootstrap/cache' \
            --exclude='.env*' \
            .

      - name: Configure SSH
        run: |
          : "${DEPLOY_HOST:?Set the DEPLOY_HOST repository variable}"
          : "${DEPLOY_USER:?Set the DEPLOY_USER repository variable}"
          : "${DEPLOY_PATH:?Set the DEPLOY_PATH repository variable}"
          : "${DEPLOY_SSH_KEY:?Set the DEPLOY_SSH_KEY production secret}"
          : "${DEPLOY_KNOWN_HOSTS:?Set the DEPLOY_KNOWN_HOSTS production secret}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Upload release archive
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH/releases' '$DEPLOY_PATH/shared'"
          scp -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes \
            "$RUNNER_TEMP/lazytown-release.tar.gz" \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/releases/$GITHUB_SHA-$GITHUB_RUN_ID.tar.gz"

      - name: Install release on server
        run: |
          printf -v remote_command 'bash -s -- %q %q %q' "$DEPLOY_PATH" "$GITHUB_SHA" "$GITHUB_RUN_ID"
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command" <<'REMOTE'
          set -Eeuo pipefail

          base="$1"
          sha="$2"
          run_id="$3"
          shared="$base/shared"
          release="$base/releases/$sha-$run_id"
          archive="$base/releases/$sha-$run_id.tar.gz"

          if [[ ! -f "$shared/.env" ]]; then
            printf 'Missing production environment file: %s/.env\n' "$shared" >&2
            exit 1
          fi

          mkdir -p \
            "$release/bootstrap/cache" \
            "$shared/storage/app/public" \
            "$shared/storage/framework/cache/data" \
            "$shared/storage/framework/sessions" \
            "$shared/storage/framework/views" \
            "$shared/storage/logs"
          tar -xzf "$archive" -C "$release"
          ln -s "$shared/.env" "$release/.env"
          ln -s "$shared/storage" "$release/storage"

          chgrp -R www-data "$shared/storage" "$release/bootstrap/cache"
          chmod -R g+rwX "$shared/storage" "$release/bootstrap/cache"
          find "$shared/storage" "$release/bootstrap/cache" -type d -exec chmod g+s {} +

          cd "$release"
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          php artisan migrate --force
          php artisan storage:link --force
          php artisan optimize:clear
          php artisan config:cache

          ln -sfn "$release" "$base/current-next"
          mv -Tf "$base/current-next" "$base/current"
          rm -f "$archive"
          REMOTE
