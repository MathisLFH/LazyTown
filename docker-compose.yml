services:
  postgres:
    image: postgres:16
    container_name: lazytown
    restart: unless-stopped
    environment:
      POSTGRES_DB: '${DB_DATABASE:?Set DB_DATABASE in the production .env}'
      POSTGRES_USER: '${DB_USERNAME:?Set DB_USERNAME in the production .env}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:?Set DB_PASSWORD in the production .env}'
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-q']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
